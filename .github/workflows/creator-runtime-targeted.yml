name: Creator Runtime Targeted Android

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level for the focused emulator test
        required: true
        default: '34'
        type: choice
        options:
          - '30'
          - '34'
      test-class:
        description: Fully-qualified instrumentation test class
        required: true
        default: pro.sketchware.creator.CreatorRuntimeNativeWidgetTest
        type: string
      test-method:
        description: Optional single test method; leave empty for the whole selected class
        required: false
        default: ''
        type: string

env:
  JAVA_VERSION: '17'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'

defaults:
  run:
    shell: bash

jobs:
  targeted-native:
    name: Targeted Android test (API ${{ inputs.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble targeted test APKs
        run: ./gradlew :app:assembleDebug :app:compileDebugAndroidTestJavaWithJavac --no-daemon --stacktrace

      - name: Enable KVM for stable emulator boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Run targeted connected Android test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_CLASS_ARG: ${{ inputs.test-class != '' && format('-Pandroid.testInstrumentationRunnerArguments.class={0}', inputs.test-class) || '' }}
          TEST_METHOD_ARG: ${{ inputs.test-method != '' && format('-Pandroid.testInstrumentationRunnerArguments.method={0}', inputs.test-method) || '' }}
        with:
          api-level: ${{ inputs.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace ${TEST_CLASS_ARG} ${TEST_METHOD_ARG}

      - name: Upload targeted Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-runtime-targeted-reports-api-${{ inputs.api-level }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
