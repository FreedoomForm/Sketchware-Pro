name: Build AI APK

on:
  push:
    branches:
      - main
      - master
      - '*ai*'
    paths:
      - '.github/workflows/build_ai_apk.yml'
      - '.github/workflows/create_mock_google_services.sh'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Step 1: Run JVM unit tests (no Android device required).
  #         If any test fails, the workflow stops here and no APK is built.
  # =========================================================================
  unit-test:
    name: Run JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create mock google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/workflows/create_mock_google_services.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: ./gradlew testDebugUnitTest --continue --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ steps.set_sha.outputs.short_sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  # =========================================================================
  # Step 2: Run Android instrumentation tests on an emulator.
  #         This job is best-effort: if it fails, the APK is still built.
  #         The e2e Mistral test handles a missing API key gracefully
  #         (an error row counts as a valid UI update).
  # =========================================================================
  instrumentation-test:
    name: Run Android instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create mock google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/workflows/create_mock_google_services.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM (for hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          heap-size: 512M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --continue --console=plain

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports-${{ needs.unit-test.outputs.short_sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  # =========================================================================
  # Step 3: Build the Debug APK. Depends only on unit-test (instrumentation
  #         is best-effort and should not block APK generation).
  # =========================================================================
  build:
    name: Build AI-Enabled APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-test
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create mock google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/workflows/create_mock_google_services.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK with commit hash + branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SAFE=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_-]/_/g')
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/sketchware-pro-ai-${BRANCH_SAFE}-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sketchware-pro-ai-apk-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/sketchware-pro-ai-*.apk
          retention-days: 90
          compression-level: 0

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.set_sha.outputs.short_sha }}
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
